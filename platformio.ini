; Signal finder turntable firmware.
;
; One [env:...] per board. CI builds every env and publishes each one to the
; web flasher, so adding a board here is all it takes. Per-board options:
;   custom_board_name  label in the web flasher
;   custom_servo_pin   GPIO for the servo signal wire (default 4)
;   custom_pin_label   how that pin is marked on the board, if not "GPIO<n>"

[platformio]
default_envs = d1_mini

[env]
framework = arduino
monitor_speed = 115200
custom_servo_pin = 4
build_flags = -DSERVO_PIN=${this.custom_servo_pin}
extra_scripts = post:scripts/web_image.py

[arch_esp8266]
platform = espressif8266@4.2.1

; pioarduino: Arduino-ESP32 3.x, the PlatformIO platform that covers every
; current ESP32 chip (the official one stops at Arduino 2.x / C3).
[arch_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; One 4 MB image per chip, so it also runs on boards with bigger flash.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Chips with their own USB port. Serial is that port, Serial0 is UART0; the
; firmware answers on both, whichever one the board's USB socket is wired to.
[arch_esp32_usb]
extends = arch_esp32
build_flags = -DSERVO_PIN=${this.custom_servo_pin} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

; --- ESP8266 -----------------------------------------------------------------

[env:d1_mini]
extends = arch_esp8266
board = d1_mini
custom_board_name = Wemos D1 mini
custom_pin_label = D2 (GPIO4)

[env:d1_mini_lite]
extends = arch_esp8266
board = d1_mini_lite
custom_board_name = Wemos D1 mini lite (ESP8285)
custom_pin_label = D2 (GPIO4)

[env:nodemcuv2]
extends = arch_esp8266
board = nodemcuv2
custom_board_name = NodeMCU v2 / v3
custom_pin_label = D2 (GPIO4)

[env:esp01_1m]
extends = arch_esp8266
board = esp01_1m
custom_board_name = ESP-01 / ESP-01S
; GPIO2 is the only free pin. It must not be held low while the board boots.
custom_servo_pin = 2

; --- ESP32 -------------------------------------------------------------------

[env:esp32dev]
extends = arch_esp32
board = esp32dev
custom_board_name = ESP32 (DevKit, WROOM, WROVER, ...)

[env:esp32s2]
extends = arch_esp32
board = esp32-s2-saola-1
custom_board_name = ESP32-S2 (Saola, S2 mini, ...)
; The S2 has USB OTG only, no USB-Serial-JTAG, hence USB_MODE=0.
build_flags = -DSERVO_PIN=${this.custom_servo_pin} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=0

[env:esp32s3]
extends = arch_esp32_usb
board = esp32-s3-devkitc-1
custom_board_name = ESP32-S3 (DevKitC-1, S3 Zero, ...)

[env:esp32c3]
extends = arch_esp32_usb
board = esp32-c3-devkitm-1
custom_board_name = ESP32-C3 (DevKitM-1, C3 SuperMini, ...)

[env:esp32c5]
extends = arch_esp32_usb
board = esp32-c5-devkitc-1
custom_board_name = ESP32-C5

[env:esp32c6]
extends = arch_esp32_usb
board = esp32-c6-devkitc-1
custom_board_name = ESP32-C6

[env:esp32h2]
extends = arch_esp32_usb
board = esp32-h2-devkitm-1
custom_board_name = ESP32-H2

; ESP32-P4 builds for chip revision < 3 and >= 3 don't run on each other.
[env:esp32p4]
extends = arch_esp32_usb
board = esp32-p4
custom_board_name = ESP32-P4 (chip rev. below v3)

[env:esp32p4_r3]
extends = arch_esp32_usb
board = esp32-p4_r3
custom_board_name = ESP32-P4 (chip rev. v3 or newer)
