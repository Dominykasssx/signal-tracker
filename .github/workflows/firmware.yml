name: Firmware

# Builds every [env:*] in platformio.ini. On the default branch it also
# publishes the web flasher (web/index.html + all images) to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          list=$(python3 -c '
          import configparser, json
          c = configparser.ConfigParser(interpolation=None)
          c.read("platformio.ini")
          print(json.dumps([s[4:] for s in c.sections() if s.startswith("env:")]))
          ')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for the firmware version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install platformio==6.2.0
      - name: Build
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          export FW_VERSION=$(git describe --tags --always)
          pio run -e "$ENV_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/signal_finder-${{ matrix.env }}.bin
            .pio/build/${{ matrix.env }}/manifest.json
            .pio/build/${{ matrix.env }}/board.json
          if-no-files-found: error

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp web/index.html site/
          for dir in artifacts/firmware-*; do
            mv "$dir" "site/firmware/${dir#artifacts/firmware-}"
          done
          jq -s 'sort_by(.chip, .name)' site/firmware/*/board.json > site/boards.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
